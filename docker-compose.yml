version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoqa-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HEADLESS=true
    volumes:
      - ./backend/artifacts:/app/artifacts
      - ./backend/autoqa.db:/app/autoqa.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autoqa-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/api/v1/ws
    depends_on:
      - backend
